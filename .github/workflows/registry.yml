# Publishes the registry site to GitHub Pages on every push to main (a release): the landing
# page, the shadcn registry JSON (r/) and the Ladle playground (playground/). The work is done by
# the shared workflow from integr8-config; the site itself is described in registry/site.config.mjs.
# integr8-config has no v1 tag yet, so this points at main (like ci.yml). Switch to @v1 once it exists.
#
# Setup once: repo Settings → Pages → Source: "GitHub Actions".
# To turn the site off: set "integr8": { "site": false } in package.json (the run then stays green
# with the build and deploy jobs skipped).
# To move the site, set two repository variables (Settings → Secrets and variables → Actions →
# Variables):
#   REGISTRY_BASE_URL  full URL of the JSON folder, such as https://example.com/wm/r
#   SITE_BASE_PATH     path the site is served from, such as /wm/
name: Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

# A reusable workflow cannot grant more than its caller gives it.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  site:
    uses: MinaLouisLeon/integr8-config/.github/workflows/registry-site.yml@main
